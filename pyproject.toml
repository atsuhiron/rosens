[project]
name = "rosens"
version = "2.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "polars>=2.1.0",
    "pydantic>=2.14.2",
    "tzdata>=2026.6; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
]

[project.scripts]
rosens-server = "rosens.server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosens"]
